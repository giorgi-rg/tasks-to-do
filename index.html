<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks to Do</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for running JSX in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [tasks, setTasks] = React.useState(() => {
        const saved = localStorage.getItem('tasks_to_do_data');
        return saved ? JSON.parse(saved) : [];
      });
      const [input, setInput] = React.useState('');

      React.useEffect(() => {
        localStorage.setItem('tasks_to_do_data', JSON.stringify(tasks));
      }, [tasks]);

      const addTask = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        setTasks([{ id: Date.now(), text: input, completed: false }, ...tasks]);
        setInput('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      return (
        <div className="max-w-md mx-auto p-4 sm:p-6 min-h-screen flex flex-col">
          <header className="mb-6 text-center pt-4">
            <h1 className="text-3xl font-extrabold text-indigo-400 tracking-tight">Tasks to Do</h1>
            <p className="text-slate-400 text-sm mt-1">Your lightning-fast task manager</p>
          </header>

          <form onSubmit={addTask} className="flex gap-2 mb-6">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="What needs to be done?"
              className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm"
            />
            <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition-colors shadow-lg shadow-indigo-600/20">
              Add
            </button>
          </form>

          <div className="space-y-2.5 flex-1 pb-10">
            {tasks.length === 0 ? (
              <div className="text-center py-12 bg-slate-900/50 rounded-2xl border border-dashed border-slate-800">
                <p className="text-slate-300 font-medium text-sm">All caught up!</p>
                <p className="text-xs text-slate-500 mt-1">Add a task above to get started.</p>
              </div>
            ) : (
              tasks.map(task => (
                <div key={task.id} className="flex items-center justify-between bg-slate-900/80 p-3.5 rounded-xl border border-slate-800/80 shadow-sm transition-all">
                  <div onClick={() => toggleTask(task.id)} className="flex items-center gap-3 cursor-pointer flex-1 pr-2 select-none">
                    <div className={`w-5 h-5 rounded-lg border flex items-center justify-center transition-colors ${task.completed ? 'bg-indigo-600 border-indigo-600' : 'border-slate-700 bg-slate-800'}`}>
                      {task.completed && <span className="text-white text-xs font-bold">✓</span>}
                    </div>
                    <span className={`text-sm transition-all ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                      {task.text}
                    </span>
                  </div>
                  <button onClick={() => deleteTask(task.id)} className="text-slate-600 hover:text-red-400 p-2 transition-colors">
                    ✕
                  </button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
