<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tasks to Do</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind Config for Custom Colors -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation State
      const [activeTab, setActiveTab] = useState('tasks');
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'dark');

      // Data States
      const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('app_tasks')) || [
        { id: 1, text: 'Welcome to Tasks to Do!', completed: false, category: 'Personal' }
      ]);
      const [projects, setProjects] = useState(() => JSON.parse(localStorage.getItem('app_projects')) || [
        { id: 1, name: 'Mobile Launch', progress: 80, color: 'bg-indigo-500' },
        { id: 2, name: 'Personal Goals', progress: 40, color: 'bg-emerald-500' }
      ]);
      const [habits, setHabits] = useState(() => JSON.parse(localStorage.getItem('app_habits')) || [
        { id: 1, name: 'Read 15 mins', streak: 4, doneToday: false },
        { id: 2, name: 'Drink Water', streak: 12, doneToday: true }
      ]);
      const [reflections, setReflections] = useState(() => JSON.parse(localStorage.getItem('app_reflections')) || []);

      // Form Inputs
      const [taskInput, setTaskInput] = useState('');
      const [reflectionInput, setReflectionInput] = useState('');

      // Focus Timer State
      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);

      // Theme toggle
      useEffect(() => {
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      // LocalStorage sync
      useEffect(() => { localStorage.setItem('app_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('app_habits', JSON.stringify(habits)); }, [habits]);
      useEffect(() => { localStorage.setItem('app_reflections', JSON.stringify(reflections)); }, [reflections]);

      // Timer Logic
      useEffect(() => {
        let interval = null;
        if (timerRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (timeLeft === 0) {
          setTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [timerRunning, timeLeft]);

      // Handlers
      const addTask = (e) => {
        e.preventDefault();
        if (!taskInput.trim()) return;
        setTasks([{ id: Date.now(), text: taskInput, completed: false, category: 'General' }, ...tasks]);
        setTaskInput('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const toggleHabit = (id) => {
        setHabits(habits.map(h => {
          if (h.id === id) {
            const nextState = !h.doneToday;
            return { ...h, doneToday: nextState, streak: nextState ? h.streak + 1 : h.streak - 1 };
          }
          return h;
        }));
      };

      const addReflection = (e) => {
        e.preventDefault();
        if (!reflectionInput.trim()) return;
        setReflections([{ id: Date.now(), text: reflectionInput, date: new Date().toLocaleDateString() }, ...reflections]);
        setReflectionInput('');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      };

      return (
        <div className="max-w-md mx-auto pb-24 min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* Top Bar */}
          <header className="p-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
            <div>
              <h1 className="text-xl font-bold bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Tasks to Do</h1>
              <p className="text-xs text-slate-400 capitalize">{activeTab} Section</p>
            </div>
            <button 
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="p-2 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300 active:scale-95 transition"
            >
              {theme === 'dark' ? '🌙 Dark' : '☀️ Light'}
            </button>
          </header>

          {/* Main Body per Tab */}
          <main className="p-4 flex-1">
            
            {/* TASKS TAB */}
            {activeTab === 'tasks' && (
              <div className="space-y-4">
                <form onSubmit={addTask} className="flex gap-2">
                  <input
                    type="text"
                    value={taskInput}
                    onChange={(e) => setTaskInput(e.target.value)}
                    placeholder="Add a new task..."
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500"
                  />
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl font-medium text-sm">
                    Add
                  </button>
                </form>

                <div className="space-y-2">
                  {tasks.map(task => (
                    <div key={task.id} className="flex items-center justify-between bg-slate-900/90 p-3.5 rounded-xl border border-slate-800">
                      <div onClick={() => toggleTask(task.id)} className="flex items-center gap-3 cursor-pointer flex-1">
                        <div className={`w-5 h-5 rounded-md border flex items-center justify-center ${task.completed ? 'bg-indigo-600 border-indigo-600' : 'border-slate-700 bg-slate-800'}`}>
                          {task.completed && <span className="text-xs font-bold">✓</span>}
                        </div>
                        <span className={`text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                          {task.text}
                        </span>
                      </div>
                      <button onClick={() => deleteTask(task.id)} className="text-slate-500 hover:text-red-400 p-1 text-sm">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PROJECTS TAB */}
            {activeTab === 'projects' && (
              <div className="space-y-4">
                <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Active Projects</h2>
                <div className="space-y-3">
                  {projects.map(p => (
                    <div key={p.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between text-sm font-medium">
                        <span>{p.name}</span>
                        <span className="text-indigo-400">{p.progress}%</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div className={`h-full ${p.color}`} style={{ width: `${p.progress}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* HABITS TAB */}
            {activeTab === 'habits' && (
              <div className="space-y-4">
                <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Daily Habits</h2>
                <div className="space-y-2">
                  {habits.map(h => (
                    <div key={h.id} className="flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                      <div>
                        <p className="text-sm font-medium">{h.name}</p>
                        <p className="text-xs text-slate
