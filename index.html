<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tasks to Do</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (Development builds for stable browser parsing) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [activeTab, setActiveTab] = useState('tasks');
      const [theme, setTheme] = useState(() => localStorage.getItem('app_theme') || 'dark');

      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('app_tasks');
        return saved ? JSON.parse(saved) : [
          { id: 1, text: 'Welcome to Tasks to Do!', completed: false }
        ];
      });

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem('app_projects');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: 'Mobile Launch', progress: 80, color: 'bg-indigo-500' },
          { id: 2, name: 'Personal Goals', progress: 40, color: 'bg-emerald-500' }
        ];
      });

      const [habits, setHabits] = useState(() => {
        const saved = localStorage.getItem('app_habits');
        return saved ? JSON.parse(saved) : [
          { id: 1, name: 'Read 15 mins', streak: 4, doneToday: false },
          { id: 2, name: 'Drink Water', streak: 12, doneToday: true }
        ];
      });

      const [reflections, setReflections] = useState(() => {
        const saved = localStorage.getItem('app_reflections');
        return saved ? JSON.parse(saved) : [];
      });

      const [taskInput, setTaskInput] = useState('');
      const [reflectionInput, setReflectionInput] = useState('');

      const [timeLeft, setTimeLeft] = useState(25 * 60);
      const [timerRunning, setTimerRunning] = useState(false);

      useEffect(() => {
        localStorage.setItem('app_theme', theme);
      }, [theme]);

      useEffect(() => { localStorage.setItem('app_tasks', JSON.stringify(tasks)); }, [tasks]);
      useEffect(() => { localStorage.setItem('app_habits', JSON.stringify(habits)); }, [habits]);
      useEffect(() => { localStorage.setItem('app_reflections', JSON.stringify(reflections)); }, [reflections]);

      useEffect(() => {
        let interval = null;
        if (timerRunning && timeLeft > 0) {
          interval = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (timeLeft === 0) {
          setTimerRunning(false);
        }
        return () => clearInterval(interval);
      }, [timerRunning, timeLeft]);

      const addTask = (e) => {
        e.preventDefault();
        if (!taskInput.trim()) return;
        setTasks([{ id: Date.now(), text: taskInput, completed: false }, ...tasks]);
        setTaskInput('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      const toggleHabit = (id) => {
        setHabits(habits.map(h => {
          if (h.id === id) {
            const nextState = !h.doneToday;
            return { ...h, doneToday: nextState, streak: nextState ? h.streak + 1 : h.streak - 1 };
          }
          return h;
        }));
      };

      const addReflection = (e) => {
        e.preventDefault();
        if (!reflectionInput.trim()) return;
        setReflections([{ id: Date.now(), text: reflectionInput, date: new Date().toLocaleDateString() }, ...reflections]);
        setReflectionInput('');
      };

      const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = seconds % 60;
        return (mins < 10 ? '0' + mins : mins) + ':' + (secs < 10 ? '0' + secs : secs);
      };

      return (
        <div className="max-w-md mx-auto pb-24 min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          <header className="p-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-10">
            <div>
              <h1 className="text-xl font-bold text-indigo-400">Tasks to Do</h1>
              <p className="text-xs text-slate-400 capitalize">{activeTab} Section</p>
            </div>
            <button 
              onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
              className="px-3 py-1.5 bg-slate-800 rounded-lg text-xs font-semibold text-slate-300"
            >
              {theme === 'dark' ? '🌙 Dark' : '☀️ Light'}
            </button>
          </header>

          <main className="p-4 flex-1">
            {activeTab === 'tasks' && (
              <div className="space-y-4">
                <form onSubmit={addTask} className="flex gap-2">
                  <input
                    type="text"
                    value={taskInput}
                    onChange={(e) => setTaskInput(e.target.value)}
                    placeholder="Add a new task..."
                    className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500"
                  />
                  <button type="submit" className="bg-indigo-600 hover:bg-indigo-500 px-5 py-3 rounded-xl font-medium text-sm text-white">
                    Add
                  </button>
                </form>

                <div className="space-y-2">
                  {tasks.map(task => (
                    <div key={task.id} className="flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                      <div onClick={() => toggleTask(task.id)} className="flex items-center gap-3 cursor-pointer flex-1">
                        <div className={'w-5 h-5 rounded-md border flex items-center justify-center ' + (task.completed ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-700 bg-slate-800')}>
                          {task.completed && <span className="text-xs font-bold">✓</span>}
                        </div>
                        <span className={'text-sm ' + (task.completed ? 'line-through text-slate-500' : 'text-slate-200')}>
                          {task.text}
                        </span>
                      </div>
                      <button onClick={() => deleteTask(task.id)} className="text-slate-500 hover:text-red-400 p-1 text-sm">✕</button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'projects' && (
              <div className="space-y-4">
                <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Active Projects</h2>
                <div className="space-y-3">
                  {projects.map(p => (
                    <div key={p.id} className="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                      <div className="flex justify-between text-sm font-medium">
                        <span>{p.name}</span>
                        <span className="text-indigo-400">{p.progress}%</span>
                      </div>
                      <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div className={'h-full ' + p.color} style={{ width: p.progress + '%' }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'habits' && (
              <div className="space-y-4">
                <h2 className="text-sm font-semibold text-slate-400 uppercase tracking-wider">Daily Habits</h2>
                <div className="space-y-2">
                  {habits.map(h => (
                    <div key={h.id} className="flex items-center justify-between bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                      <div>
                        <p className="text-sm font-medium text-slate-200">{h.name}</p>
                        <p className="text-xs text-slate-500">🔥 {h.streak} day streak</p>
                      </div>
                      <button 
                        onClick={() => toggleHabit(h.id)}
                        className={'px-4 py-2 rounded-lg text-xs font-semibold ' + (h.doneToday ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-400')}
                      >
                        {h.doneToday ? 'Completed' : 'Mark Done'}
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'timer' && (
              <div className="flex flex-col items-center justify-center py-10 space-y-6">
                <div className="text-6xl font-black tracking-widest text-indigo-400 bg-slate-900 border border-slate-800 p-8 rounded-3xl shadow-inner">
                  {formatTime(timeLeft)}
                </div>
                <div className="flex gap-3">
                  <button 
                    onClick={() => setTimerRunning(!timerRunning)}
                    className={'px-8 py-3 rounded-xl font-semibold text-sm text-white ' + (timerRunning ? 'bg-amber-600' : 'bg-indigo-600')}
                  >
                    {timerRunning ? 'Pause' : 'Start Focus'}
                  </button>
                  <button 
                    onClick={() => { setTimerRunning(false); setTimeLeft(25 * 60); }}
                    className="px-5 py-3 bg-slate-800 rounded-xl text-sm font-medium text-slate-400"
                  >
                    Reset
                  </button>
                </div>
              </div>
            )}

            {activeTab === 'reflections' && (
              <div className="space-y-4">
                <form onSubmit={addReflection} className="space-y-2">
                  <textarea
                    value={reflectionInput}
                    onChange={(e) => setReflectionInput(e.target.value)}
                    placeholder="Write a daily reflection or note..."
                    className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 h-24 text-slate-100 placeholder-slate-500"
                  />
                  <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-500 py-2.5 rounded-xl text-sm font-medium text-white">
                    Save Reflection
                  </button>
                </form>

                <div className="space-y-2">
                  {reflections.map(r => (
                    <div key={r.id} className="bg-slate-900 p-3.5 rounded-xl border border-slate-800 space-y-1">
                      <p className="text-xs text-indigo-400 font-semibold">{r.date}</p>
                      <p className="text-sm text-slate-300">{r.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900/95 border-t border-slate-800 backdrop-blur flex justify-around p-2 z-20">
            {[
              { id: 'tasks', label: 'Tasks', icon: '📋' },
              { id: 'projects', label: 'Projects', icon: '📊' },
              { id: 'habits', label: 'Habits', icon: '⚡' },
              { id: 'timer', label: 'Focus', icon: '⏱️' },
              { id: 'reflections', label: 'Notes', icon: '📝' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={'flex flex-col items-center p-2 rounded-xl text-xs transition ' + (activeTab === tab.id ? 'text-indigo-400 font-bold bg-slate-800' : 'text-slate-500')}
              >
                <span className="text-base">{tab.icon}</span>
                <span>{tab.label}</span>
              </button>
            ))}
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
