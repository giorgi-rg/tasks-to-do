<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks to Do</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tasks, setTasks] = useState(() => {
        const saved = localStorage.getItem('tasks_to_do_data');
        return saved ? JSON.parse(saved) : [];
      });
      const [input, setInput] = useState('');

      useEffect(() => {
        localStorage.setItem('tasks_to_do_data', JSON.stringify(tasks));
      }, [tasks]);

      const addTask = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        setTasks([{ id: Date.now(), text: input, completed: false }, ...tasks]);
        setInput('');
      };

      const toggleTask = (id) => {
        setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const deleteTask = (id) => {
        setTasks(tasks.filter(t => t.id !== id));
      };

      return (
        <div class="max-w-md mx-auto p-4 sm:p-6">
          <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-indigo-400">Tasks to Do</h1>
            <p class="text-slate-400 text-sm mt-1">Your minimal task manager</p>
          </header>

          <form onSubmit={addTask} class="flex gap-2 mb-6">
            <input
              type="text"
              value={input}
              onChange={(e) => setInput(e.target.value)}
              placeholder="Add a new task..."
              class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            />
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-lg font-medium">
              Add
            </button>
          </form>

          <div class="space-y-2">
            {tasks.length === 0 ? (
              <div class="text-center py-10 bg-slate-800/50 rounded-xl border border-dashed border-slate-700">
                <p class="text-slate-400 font-medium">All clean!</p>
                <p class="text-xs text-slate-500 mt-1">Add a task above to get started.</p>
              </div>
            ) : (
              tasks.map(task => (
                <div key={task.id} class="flex items-center justify-between bg-slate-800 p-3.5 rounded-lg border border-slate-700/50">
                  <div onClick={() => toggleTask(task.id)} class="flex items-center gap-3 cursor-pointer flex-1">
                    <div class={`w-5 h-5 rounded border flex items-center justify-center ${task.completed ? 'bg-indigo-600 border-indigo-600' : 'border-slate-500'}`}>
                      {task.completed && <span class="text-white text-xs">✓</span>}
                    </div>
                    <span class={`text-sm ${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}`}>
                      {task.text}
                    </span>
                  </div>
                  <button onClick={() => deleteTask(task.id)} class="text-slate-500 hover:text-red-400 p-1">
                    ✕
                  </button>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')
